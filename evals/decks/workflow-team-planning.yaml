name: workflow-team-planning
description: >
  Tier 2 workflow stress test (docs/planning/maelstrom-code-workflow-stress-test-plan.md).
  One staged case over the change-planning workflow: four sequenced
  workflow-reader sessions bind to the SAME persisted workflow instance, one
  per pipeline stage. Only the intake stage's prompt contains the change
  request; every later stage must recover the request context from the
  rendered workflow artifacts of prior stages, so this deck measures whether
  artifact handoff carries enough substance for a multi-agent relay. The
  staged harness owns the sequencing; the runtime only executes each bound
  session. Run from the repo root.
models:
  - models/openrouter-qwen3-coder-30b.yaml
  - models/openrouter-minimax-m2.5.yaml
  - models/openrouter-glm-4.7-flash.yaml
timeoutSeconds: 360
cases:
  - id: team-planning-json-summary
    workflow: workflows/change-planning.yaml
    repeats: 1
    stages:
      - id: intake
        agent: agents/workflow-reader.yaml
        prompt: >
          Change request: the eval batch summary in internal/evals should
          support a machine-readable JSON output mode alongside the existing
          human-readable printout, selectable from the CLI. You are the intake
          stage of a change-planning relay; a different agent handles each
          later stage and sees only the workflow artifacts. Formalize this
          request against the repository and deliver the intake_v1 artifact,
          then end your work.
        eval:
          require_completed: true
          min_valid_workflow_outputs: 1
          max_invalid_workflow_outputs: 1
          required_final_workflow_state: inspecting
          max_invalid_tool_proposals: 2
          max_tool_execution_failures: 1
          max_unrecovered_retries: 2
      - id: inspecting
        agent: agents/workflow-reader.yaml
        prompt: >
          You are the inspection stage of a change-planning relay. The change
          request and its unknowns are in the workflow artifacts from prior
          stages; do not invent a different request. Inspect the repository to
          resolve those unknowns, cite concrete files and symbols, and deliver
          the inspection_v1 artifact, then end your work.
        eval:
          require_completed: true
          min_valid_workflow_outputs: 1
          max_invalid_workflow_outputs: 1
          required_final_workflow_state: planning
          max_invalid_tool_proposals: 2
          max_tool_execution_failures: 1
          max_unrecovered_retries: 2
      - id: planning
        agent: agents/workflow-reader.yaml
        prompt: >
          You are the planning stage of a change-planning relay. The change
          request, inspection findings, and relevant files are in the workflow
          artifacts from prior stages; plan against those findings rather than
          re-deriving them. Deliver the plan_v1 artifact with concrete steps,
          risks, and validation, then end your work.
        eval:
          require_completed: true
          min_valid_workflow_outputs: 1
          max_invalid_workflow_outputs: 1
          required_final_workflow_state: reviewing
          max_invalid_tool_proposals: 2
          max_tool_execution_failures: 1
          max_unrecovered_retries: 2
      - id: reviewing
        agent: agents/workflow-reader.yaml
        prompt: >
          You are the review stage of a change-planning relay. The plan under
          review and the evidence behind it are in the workflow artifacts from
          prior stages. Verify the plan's steps against the repository, then
          deliver the review_v1 artifact with your verdict and objections
          (or state none), then end your work.
        eval:
          require_completed: true
          min_valid_workflow_outputs: 1
          max_invalid_workflow_outputs: 1
          required_final_workflow_state: done
          max_invalid_tool_proposals: 2
          max_tool_execution_failures: 1
          max_unrecovered_retries: 2
