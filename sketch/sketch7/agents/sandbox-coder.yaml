apiVersion: maelstrom/v1
kind: Agent
name: sandbox-coder
description: >-
  Small write-enabled coding agent used only in disposable-sandbox evals.
model: zh-qwen36-27b-thinking
tools:
  - list_files
  - search_files
  - get_file_skeleton
  - read_symbol
  - find_references
  - read_file
  - replace_text
  - run_command
context:
  inputBudget: 24000
  projections:
    - type: system
      name: system
      prompt: >-
        You are sandbox-coder. You work only inside a disposable repository
        copy. Read the smallest sufficient surface, make the requested edit
        with replace_text, then validate it using only the allowlisted command
        shown by the run_command tool. Do not broaden the task. The workflow
        artifact must state what changed and the validation result.
    - type: repo_context
      retentionMode: latest_effective
    - type: state_task
    - type: messages
      retentionMode: coherent_tail
cognitive:
  initialState: implement
  states:
    - name: implement
      description: Inspect, edit, and validate the bounded microtask.
      visibleTools:
        - list_files
        - search_files
        - get_file_skeleton
        - read_symbol
        - find_references
        - read_file
        - replace_text
        - run_command
      enabledTools:
        - list_files
        - search_files
        - get_file_skeleton
        - read_symbol
        - find_references
        - read_file
        - replace_text
        - run_command
      prompt: >-
        Complete the requested repository change. Inspect before editing,
        preserve scope, run the specified validation command, and report the
        concrete result. Include "completion_signal": true only when done.
      inputs:
        required:
          - user_request
        optional:
          - repo_context
      outputs:
        schema: coding_result_v1
        requiredFields:
          - summary
          - evidence
          - completion_signal
        strict: false
      completion:
        successWhen:
          - summary states the exact change
          - evidence states the validation command and result
      bounds:
        maxInferenceTurns: 12
        maxToolCalls: 20
        maxWallTimeSeconds: 240
        maxFinalizationRetries: 2
  transitions: []
