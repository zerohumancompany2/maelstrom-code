name: sandbox-write-microtasks
description: >
  Phase 4 write-enabled tier. Every run executes in a disposable repository
  copy; replace_text and the no-shell allowlisted run_command are unavailable
  unless sandbox is true. The committed source fixtures intentionally remain
  broken, while post-run file checks and Go tests must pass inside each copy.
models:
  - sketch/sketch7/models/openrouter-qwen3-coder-30b.yaml
  - sketch/sketch7/models/openrouter-minimax-m2.5.yaml
  - sketch/sketch7/models/openrouter-glm-4.7-flash.yaml
timeoutSeconds: 300
cases:
  - id: single-file-greeting-fix
    agent: sketch/sketch7/agents/sandbox-coder.yaml
    workflow: sketch/sketch7/workflows/sandbox-microtask.yaml
    sandbox: true
    sandboxExcludes: ["docs"]
    commandAllowlist:
      - go test ./sketch/sketch7/evals/testdata/write-microtasks/single
    repeats: 1
    prompt: >
      Fix only sketch/sketch7/evals/testdata/write-microtasks/single/greeting.go
      so Greeting returns exactly "hello from maelstrom". Inspect the source
      and its test, make the minimal edit, then validate with exactly:
      go test ./sketch/sketch7/evals/testdata/write-microtasks/single
    eval:
      require_completed: true
      min_valid_workflow_outputs: 1
      max_invalid_workflow_outputs: 1
      required_final_workflow_state: done
      # Cognitive observations are diagnostic noise in this tier; disk state,
      # command execution, and the workflow artifact are the write gate.
      max_invalid_outputs: 8
      max_missing_required: 8
      max_invalid_tool_proposals: 2
      max_tool_execution_failures: 1
      max_unrecovered_retries: 4
      required_file_contains:
        - path: sketch/sketch7/evals/testdata/write-microtasks/single/greeting.go
          terms:
            - hello from maelstrom

  - id: multi-file-retry-fix
    agent: sketch/sketch7/agents/sandbox-coder.yaml
    workflow: sketch/sketch7/workflows/sandbox-microtask.yaml
    sandbox: true
    sandboxExcludes: ["docs"]
    commandAllowlist:
      - go test ./sketch/sketch7/evals/testdata/write-microtasks/multi
    repeats: 1
    prompt: >
      Update the retry fixture as a small multi-file change. In
      sketch/sketch7/evals/testdata/write-microtasks/multi/config.go set
      RetryLimit to 3 and make RetryLabel return exactly "retries enabled: 3".
      In the adjacent
      README.md replace the sentence about disabled retries with exactly
      "Transient provider errors are retried up to 3 times." Inspect the
      files first, keep all other content intact, then validate with exactly:
      go test ./sketch/sketch7/evals/testdata/write-microtasks/multi
    eval:
      require_completed: true
      min_valid_workflow_outputs: 1
      max_invalid_workflow_outputs: 1
      required_final_workflow_state: done
      max_invalid_outputs: 8
      max_missing_required: 8
      max_invalid_tool_proposals: 2
      max_tool_execution_failures: 1
      max_unrecovered_retries: 4
      required_file_contains:
        - path: sketch/sketch7/evals/testdata/write-microtasks/multi/config.go
          terms:
            - RetryLimit = 3
            - "retries enabled: 3"
        - path: sketch/sketch7/evals/testdata/write-microtasks/multi/README.md
          terms:
            - Transient provider errors are retried up to 3 times.
