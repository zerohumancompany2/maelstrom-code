id: synthesis.context_inference.mechanism_summary.v1
version: 1
category: synthesis
sub_category: mechanism_summary
status: draft
summary: Verify that the model can summarize the context inference mechanism from a fixed evidence bundle.
source_basis:
  - docs/reports/bounded-task-inference-experiments-2026-06-02.md
  - docs/reports/bounded-task-comparison-and-coverage-gating-2026-06-03.md
prompt_mode: fixed_evidence_bundle
setup:
  harness: synthesis_only
  target_task: context_inference_review
  required_output_shape: narrative_or_structured_findings
  evidence_bundle_candidates:
    - sketch/sketch7/context/context.go
    - sketch/sketch7/context/sections.go
    - sketch/sketch7/context/repo.go
required_facts:
  - id: payload_assembly
    description: Explains that the system builds an inference payload from sections plus transcript/messages.
  - id: transcript_trimming
    description: Explains that transcript/message trimming preserves a recent usable conversation tail or anchor.
  - id: section_projection_building
    description: Explains that sections are built from agent definition/context projections and runtime/session state.
  - id: repo_context_generation
    description: Explains that repo context is generated or summarized separately rather than being hardcoded into the payload.
expected_issues: []
expected_recommendations: []
forbidden_claims:
  - Claims behavior that requires adjacent call-chain evidence while presenting it as certain.
metrics:
  primary:
    - fact_recall
  secondary:
    - unsupported_claim_count
    - uncertainty_calibration
thresholds:
  fact_recall: 0.75
  unsupported_claim_count: 0
ranking:
  gate_first: true
  primary:
    - fact_recall
  secondary:
    - unsupported_claim_count
scoring:
  strategy: synthesis_gate_first
  formulas:
    fact_recall: facts_covered / total_required_facts
    synthesis_score: 0.40 * fact_recall - hallucination_penalty
observability:
  event_sources:
    - assistant final report or synthesis-only output
  notes:
    - Initial scoring will likely require lightweight rubric or keyword-assisted review.
pass_condition:
  all:
    - metric: fact_recall
      op: ">="
      value: 0.75
    - metric: unsupported_claim_count
      op: "=="
      value: 0
failure_modes:
  - Misses core mechanism components.
  - Overstates conclusions not justified by supplied evidence.
notes:
  - This benchmark is intentionally synthesis-only and should not score discovery behavior.
