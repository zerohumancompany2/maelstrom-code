id: discovery.context_inference.test_coverage.v1
version: 1
category: discovery
sub_category: test_coverage
status: draft
summary: Verify that the model reads the relevant context inference test file.
source_basis:
  - docs/experiments/bounded_task_runner.py
  - docs/reports/bounded-task-inference-experiments-2026-06-02.md
  - docs/reports/bounded-task-comparison-and-coverage-gating-2026-06-03.md
prompt: >
  Review our implementation of context ofr inferrence in sketch/sketch7 and
  report how it functions. List any issues you see. Make recommendations on
  architectural improvements.
setup:
  harness: bounded_task_runner
  task_name: repo_inspection
  mode_candidates:
    - bounded
    - bounded_v2
    - bounded_v2a
    - bounded_v3
    - plain
  allowed_tools:
    - list_files
    - search_files
    - read_file
  repo_root: .
required_files: []
useful_files: []
adjacent_files: []
required_tests:
  - sketch/sketch7/context/context_test.go
metrics:
  primary:
    - test_recall
  secondary:
    - tool_calls_until_first_test_read
    - discovery_precision
thresholds:
  test_recall: 1.0
ranking:
  gate_first: true
  primary:
    - test_recall
  secondary:
    - tool_calls_until_first_test_read
    - discovery_precision
scoring:
  strategy: gate_first
  formulas:
    test_recall: required_tests_read / total_required_tests
    discovery_precision: relevant_reads / total_reads
observability:
  event_sources:
    - raw_run.metrics.read_test_files
    - raw_run.metrics.unique_files_read
  notes:
    - raw metric read_test_files is sufficient for pass/fail if exact-path tracking is unavailable.
pass_condition:
  all:
    - metric: test_recall
      op: ">="
      value: 1.0
failure_modes:
  - Did not inspect any relevant test evidence.
  - Attempted synthesis without validating behavior against tests.
notes:
  - This benchmark isolates test-file discovery from broader implementation or integration coverage.
