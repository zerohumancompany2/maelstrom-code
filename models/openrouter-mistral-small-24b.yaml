apiVersion: maelstrom/v1
kind: Model
name: mistral-small-24b
description: Mistral Small 3.2 24B instruct via OpenRouter; local-class stand-in for eval batteries.
providers:
  - name: openrouter
    modelRef: mistralai/mistral-small-3.2-24b-instruct
limits:
  contextWindow: 128000
  maxOutputTokens: 8192
defaults:
  temperature: 0.0
  topP: 1.0
capabilities:
  tools: true
  reasoning: false
  multimodal: false
  streaming: false
