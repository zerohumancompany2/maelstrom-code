apiVersion: maelstrom/v1
kind: Model
name: qwen3-coder-30b
description: Qwen3 Coder 30B A3B instruct via OpenRouter; local-class stand-in for eval batteries.
providers:
  - name: openrouter
    modelRef: qwen/qwen3-coder-30b-a3b-instruct
limits:
  contextWindow: 131072
  maxOutputTokens: 8192
defaults:
  temperature: 0.0
  topP: 1.0
capabilities:
  tools: true
  reasoning: false
  multimodal: false
  streaming: false
